name: tienda-cocis-ec2

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cocis
      POSTGRES_DB: tiendacocis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env.ec2}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocis -d tiendacocis"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  backend:
    build: ./tienda-cocis-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      # Generar una contraseña hexadecimal evita caracteres reservados en la URL.
      DATABASE_URL: postgres://cocis:${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}@db:5432/tiendacocis?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/products"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *logging

  frontend:
    build:
      context: ./tienda-cocis-frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${LISTEN_IP:-127.0.0.1}:${HTTP_PORT:-8088}:80"
      - "${LISTEN_IP:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
      DEMO_USER: ${DEMO_USER:-seminario}
      DEMO_PASSWORD_HASH: ${DEMO_PASSWORD_HASH:?Configura DEMO_PASSWORD_HASH en .env.ec2}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
